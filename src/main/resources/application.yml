server:
  port: ${PORT:8080}

spring:
  application:
    name: personal-finance-manager

  datasource:
    url: jdbc:h2:file:./data/financedb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  session:
    store-type: none

logging:
  level:
    com.financemanager: INFO
    org.springframework.security: WARN
